name: CinePick CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Maven Unit Tests
  # ──────────────────────────────────────────────
  test:
    name: Backend Unit Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit Tests
        run: mvn test

  # ──────────────────────────────────────────────
  # JOB 2: Docker Image Build & Compose Smoke Test
  # ──────────────────────────────────────────────
  docker-build:
    name: Build & Verify Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cinepick-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./cinepick
          file: ./cinepick/Dockerfile
          push: false
          tags: cinepick-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose Orchestration (postgres + redis only)
        run: |
          # Create a minimal .env stub so docker compose doesn't fail on missing file
          cat > .env.production <<'EOF'
          SPRING_AI_OPENAI_API_KEY=dummy
          JWT_SECRET=dummy-secret-for-ci-only
          POSTGRES_PASSWORD=postgrespassword
          EOF

          # Only spin up stateful dependencies — no backend build needed here
          docker compose -f docker-compose.yml up -d postgres redis

          # Wait for services to become healthy
          echo "Waiting for postgres and redis to be healthy..."
          for i in $(seq 1 15); do
            POSTGRES_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' cinepick_postgres 2>/dev/null || echo "starting")
            REDIS_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' cinepick_redis 2>/dev/null || echo "starting")
            echo "  postgres=$POSTGRES_HEALTH  redis=$REDIS_HEALTH  (attempt $i/15)"
            if [ "$POSTGRES_HEALTH" = "healthy" ] && [ "$REDIS_HEALTH" = "healthy" ]; then
              echo "All services healthy!"
              break
            fi
            sleep 4
          done

          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml down
