spring:
  config:
    activate:
      on-profile: prod
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-openai-api-key-12345}
      chat:
        enabled: true
    ollama:
      chat:
        enabled: false
      embedding:
        enabled: false

  threads:
    virtual:
      enabled: true


  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cinepick_db}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgrespassword}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true # Mevcut veritabanı varsa baseline oluşturur
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

tmdb:
  api:
    key: ${TMDB_API_KEY:0c69ab87a9e59b9ae3fe3d327e651b69}
    url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: cinepick-backend
      environment: production
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: WARN
    proje.cinepick: INFO
    org.springframework.web: ERROR
    org.hibernate: ERROR
