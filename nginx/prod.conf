server {
    listen 80;
    server_name cinepick.com www.cinepick.com;

    # Certbot HTTP-01 Challenge doğrulaması için gerekli dizin
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tüm HTTP trafiğini HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cinepick.com www.cinepick.com;

    # SSL Sertifika Yolları (Certbot tarafından oluşturulur)
    ssl_certificate /etc/letsencrypt/live/cinepick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinepick.com/privkey.pem;

    # SSL Güvenlik Parametreleri
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Statik Frontend Dosyaları
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Backend API Proxy (CORS Çözümü)
    location /api/ {
        proxy_pass http://cinepick_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator Proxy
    location /actuator/ {
        proxy_pass http://cinepick_backend:8080/actuator/;
        proxy_set_header Host $host;
    }
}
