services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cinepick_postgres
    environment:
      POSTGRES_DB: cinepick_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/VectorDatabaseConfig.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cinepick_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinepick_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cinepick_redis
    ports:
      - "6379:6379"
    networks:
      - cinepick_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinepick_backend
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinepick_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./cinepick
      dockerfile: Dockerfile
    container_name: cinepick_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cinepick_network

networks:
  cinepick_network:
    driver: bridge

volumes:
  postgres_data:
